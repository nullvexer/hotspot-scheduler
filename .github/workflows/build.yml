name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the checked-in wrapper so CI builds the same Gradle the project pins.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Build the APK first: a device-testable artifact should not be blocked by a unit test.
      # The log is teed to ci/build.log so a failure can be diagnosed without Actions log access.
      - name: Build debug APK
        id: apk_build
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ci/build.log || {
            echo "::group::Kotlin/Gradle errors"
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:" ci/build.log | head -100 || true
            echo "::endgroup::"
            exit 1
          }

      # Unit tests are advisory here: the physical Galaxy A22 is the acceptance gate, so a
      # red unit test must not withhold the APK from the tester.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci/test.log || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HotspotScheduler-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish even if unit tests failed, provided the APK itself built.
      - name: Publish APK as release
        if: always() && steps.apk_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          TAG="build-${GITHUB_RUN_NUMBER}"
          SHA="$(git rev-parse --short HEAD)"
          NOTES="$(printf '%s\n' \
            "Automated build \`${TAG}\` from commit \`${SHA}\`." \
            "" \
            "Install \`app-debug.apk\` on the phone, then open the app and follow the **Setup** tab." \
            "Grant Accessibility first: it is the toggle engine and the only way to change the hotspot." \
            "" \
            "Diagnostics for any failed toggle are under Diagnostics -> Execution Logs.")"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$APK" \
              --title "Build $TAG" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi

      # Publish the failure reason on a dedicated branch so it can be read with a plain
      # `git fetch` + `git show`, without needing Actions log permissions.
      - name: Publish failure summary
        if: always() && steps.apk_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "# Build failure — run ${GITHUB_RUN_NUMBER}"
            echo
            echo "commit: $(git rev-parse HEAD)"
            echo
            echo '## Errors'
            echo '```'
            grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|Could not|Unable to" ci/build.log | head -120 || echo "(no matching lines)"
            echo '```'
            echo
            echo '## Tail of build log'
            echo '```'
            tail -120 ci/build.log
            echo '```'
          } > ci/FAILURE.md

          git config user.name  "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git fetch origin ci-diagnostics --depth=1 || true
          git checkout -B ci-diagnostics
          git add -f ci/FAILURE.md ci/build.log || true
          git commit -m "ci: failure summary for run ${GITHUB_RUN_NUMBER}" || true
          git push -f origin ci-diagnostics || true

      - name: Upload failure log on error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ci/
          if-no-files-found: ignore